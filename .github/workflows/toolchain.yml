name: toolchain

on: 
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    # 1. 关键修复：添加写权限
    permissions:
      contents: write
    strategy:
      matrix:
        target: [mipsel-linux-uclibc, mipsel-linux-musl]
    steps:
      # 建议同步升级到 v4
      - uses: actions/checkout@v4

      - name: Prepare
        run: |
          sudo apt update
          sudo apt install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd \
            fakeroot kmod cpio git python3-docutils gettext automake autopoint \
            texinfo build-essential help2man pkg-config zlib1g-dev libgmp3-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget libc-dev-bin

      - name: Build
        run: |
          make CT_TARGET=${CT_TARGET} CT_VERSION=${CT_VERSION}
          cd crosstool-ng-${CT_VERSION}/toolchain-mipsel
          tar cJf ../../${CT_TARGET}.tar.xz *
        env:
          CT_TARGET: ${{ matrix.target }}
          CT_VERSION: 1.26.0
        working-directory: toolchain

      # 修复后的 Artifact 上传
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # 通过 matrix.target 区分名称，避免 v4 的重名报错
          name: toolchain-${{ matrix.target }}
          path: toolchain/${{ matrix.target }}.tar.xz
          # 可选：设置保留天数（默认 90 天）
          retention-days: 7

      # 4. 修复 Release Not Found 问题
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: toolchain/${{ matrix.target }}.tar.xz
          tag: toolchain
          overwrite: true
          body: "Auto-compiled toolchain via GitHub Actions"
